name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/OutlookMcp.Tests --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/OutlookMcp -c Release -r win-x64 -p:PublishSingleFile=true -p:Version=$version -o dist
          if ((./dist/outlook-mcp.exe version) -notmatch [regex]::Escape($version)) { throw "built executable does not report version $version" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item skills/outlook/SKILL.md dist/SKILL.md
          Compress-Archive -Path dist/outlook-mcp.exe, dist/SKILL.md, LICENSE, README.md -DestinationPath outlook-mcp-win-x64.zip
          Copy-Item dist/outlook-mcp.exe outlook-mcp.exe
          (Get-FileHash outlook-mcp.exe -Algorithm SHA256).Hash.ToLower() + "  outlook-mcp.exe" | Set-Content outlook-mcp.exe.sha256
          (Get-FileHash outlook-mcp-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  outlook-mcp-win-x64.zip" | Set-Content outlook-mcp-win-x64.zip.sha256

      - name: Write release notes
        shell: pwsh
        run: |
          # notes = fixed "get started" header + this version's section of CHANGELOG.md
          $version = "${{ github.ref_name }}".TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $body = "## Outlook MCP $version`n`n" + (Get-Content .github/release-header.md -Raw) + $m.Groups[1].Value.Trim() + "`n"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" outlook-mcp.exe outlook-mcp.exe.sha256 outlook-mcp-win-x64.zip outlook-mcp-win-x64.zip.sha256 `
            --title "Outlook MCP ${{ github.ref_name }}" --notes-file release-notes.md
