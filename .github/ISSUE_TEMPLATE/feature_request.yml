name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do in Outlook that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: How should it look
      description: A tool name and the arguments you would expect. Remember tool definitions cost tokens, so extending an existing tool is often better than adding one.
